[workspace]
members = [
    "rustberg-common",
    "rustberg-core",
    "rustberg-optimizer",
    "rustberg-proto",
    "rustberg-proto-common",
    "rustberg-proto-common/gen",
    "rustberg-proto-models",
    "rustberg-proto-models/gen",
    "test-utils",
    "benchmarks",
    "rustberg-macros",
    "docs",
    "xtask",
]

exclude = ["dev/dependencies-check"]
resolver = "2"

[workspace.package]
authors = ["Rust Berg <dangdat234678@gmail.com>"]
edition = "2024"
readme = "README.md"
repository = "https://github.com/dangdat1111/rustberg"

rust-version = "1.98.1"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.7"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }
